spring:
  datasource:
    url: jdbc:h2:mem:medrecords;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  jwt:
    secret: test-secret-0123456789abcdef0123456789abcdef
    issuer: med-records-api-test
    access-token-ttl: PT1H
