server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: med-records-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medrecords}
    username: ${DB_USERNAME:medrecords}
    password: ${DB_PASSWORD:medrecords}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    # In production ALWAYS override this with APP_JWT_SECRET (>= 32 bytes).
    secret: ${APP_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789abcdef}
    issuer: ${APP_JWT_ISSUER:med-records-api}
    access-token-ttl: ${APP_JWT_TTL:PT1H}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: INFO
